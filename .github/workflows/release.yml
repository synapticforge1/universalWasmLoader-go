name: release

# Runs on every pushed `v*` tag. A Go module needs no registry upload: the pushed tag IS the
# release (proxy.golang.org serves it). This workflow gates the tag, then makes its GitHub Release
# page — from CI, never by hand (workspace letter H32). Only NEW tags get pages (owner,
# 2026-11-09: "only new tags will get release pages"), so there is no manual backfill trigger.
#
# Two jobs, on purpose (workspace C30; owner, 2026-11-08: "split the release workflow"):
# - `checks` runs EVERYTHING that executes third-party code — `go test` runs wazero and
#   golang.org/x/sys, the gate and the script tests run Bun — with a read-only token. The clone
#   is tokenless, so no credential sits in .git/config.
# - `release` is the only job with `contents: write`. It checks out NOTHING: it installs the
#   pinned Bun, fetches `scripts/github-release.ts` alone at the tagged commit, and runs it
#   (GitHub's REST API with GITHUB_TOKEN — no GitHub CLI, H30). The script keeps H32's order:
#   the tag exists and peels to the commit `checks` passed; a page already there is done; then
#   POST, read back, peel again. Every request has a 30 s limit (best-practices 7.21).
#
# No `uses:` steps at all: Go and Bun are installed from their official downloads, pinned by
# version AND sha256, so no third-party action code runs and the Actions policy cannot block a
# step (loader-dart's `startup_failure` lesson). To move a pin, change the version and its sha256
# together (Go: https://go.dev/dl/?mode=json&include=all; Bun: the release's SHASUMS256.txt).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}
  GO_VERSION: 1.26.4
  GO_SHA256: 1153d3d50e0ac764b447adfe05c2bcf08e889d42a02e0fe0259bd47f6733ad7f
  BUN_VERSION: 1.4.4
  BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the tag (full history for the gate; no token)
        run: |
          set -euo pipefail
          git clone --branch "$TAG" "https://github.com/${{ github.repository }}" .
          commit="$(git rev-parse HEAD)"
          [ "$commit" = "${{ github.sha }}" ] || { echo "::error::tag $TAG no longer points at ${{ github.sha }} (now $commit)"; exit 1; }

      - name: Install Go (pinned by sha256)
        run: |
          set -euo pipefail
          mod="$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)"
          [ "$mod" = "$GO_VERSION" ] || { echo "::error::go.mod says go $mod; the workflow pins $GO_VERSION — move GO_VERSION and GO_SHA256 together"; exit 1; }
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/go.tgz" "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  $RUNNER_TEMP/go.tgz" | sha256sum -c -
          sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf "$RUNNER_TEMP/go.tgz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Install Bun (pinned by sha256)
        run: |
          set -euo pipefail
          # Retries transient download failures (loader-rs met a 504 here, run 42567711837); the
          # sha256 check still decides.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/bun.zip" && mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: go version && bun --version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Release gate: the SPEC fixture suite (tests/ = loader-js's stamped set) and the API
      # surface snapshot.
      - name: Test
        run: go test -count=1 ./...

      # The release-page script's own tests (a mock GitHub API; H32's order, the time limit).
      - name: Test the release-page script
        run: bun test scripts/

      # The compatibility gate (workspace layout-and-packaging.md Rules 2, 3, 6): the step from
      # the previous tag must meet the API-surface / SPEC floor, and the previous tag's tests
      # must pass for a compatible step.
      - name: Compatibility gate
        run: bun scripts/compat.ts --release "$TAG"

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # only for the POST in scripts/github-release.ts
    steps:
      - name: Install Bun (pinned by sha256)
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/bun.zip" && mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # The script alone, at the tagged commit — no checkout, so no package code beside the token.
      - name: Fetch the release-page script at the tagged commit
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 -o "$RUNNER_TEMP/github-release.ts" \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/github-release.ts"

      - name: Create the GitHub Release page (REST API)
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: bun github-release.ts
