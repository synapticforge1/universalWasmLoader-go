name: release

# Publishes a GitHub Release whenever a semver tag is pushed. A Go module needs no registry
# upload: the pushed tag IS the release (proxy.golang.org serves it); this workflow gates it and
# writes the Release notes. Manual runs (workflow_dispatch) backfill a tag pushed before this
# workflow existed.
#
# Two jobs, on purpose (workspace C30; owner, 2026-11-08: "split the release workflow"):
# - `checks` runs EVERYTHING that executes third-party code — `go test` runs wazero and
#   golang.org/x/sys, the gate runs Bun — with a read-only token. The clone is tokenless, so no
#   credential sits in .git/config.
# - `release` runs on a fresh runner and executes only git, awk and `gh`; it is the only job with
#   `contents: write`, and it first checks that the tag still points at the commit `checks` passed.
#
# No `uses:` steps at all: Go and Bun are installed from their official downloads, pinned by
# version AND sha256, so no third-party action code runs and the Actions policy cannot block a
# step (loader-dart's `startup_failure` lesson). To move a pin, change the version and its sha256
# together (Go: https://go.dev/dl/?mode=json&include=all; Bun: the release's SHASUMS256.txt).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GO_VERSION: 1.26.4
  GO_SHA256: 1153d3d50e0ac764b447adfe05c2bcf08e889d42a02e0fe0259bd47f6733ad7f
  BUN_VERSION: 1.4.4
  BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.clone.outputs.commit }}
    steps:
      - name: Clone the tag (full history for the gate; no token)
        id: clone
        run: |
          set -euo pipefail
          git clone --branch "$TAG" "https://github.com/${{ github.repository }}" .
          commit="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "push" ] && [ "$commit" != "${{ github.sha }}" ]; then
            echo "::error::tag $TAG no longer points at ${{ github.sha }} (now $commit)"; exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Install Go (pinned by sha256)
        run: |
          set -euo pipefail
          mod="$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)"
          [ "$mod" = "$GO_VERSION" ] || { echo "::error::go.mod says go $mod; the workflow pins $GO_VERSION — move GO_VERSION and GO_SHA256 together"; exit 1; }
          curl -fsSL -o go.tgz "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  go.tgz" | sha256sum -c -
          sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf go.tgz && rm go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Install Bun (pinned by sha256)
        run: |
          set -euo pipefail
          curl -fsSL -o bun.zip "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  bun.zip" | sha256sum -c -
          unzip -q bun.zip && mkdir -p "$HOME/.bun/bin" && mv bun-linux-x64/bun "$HOME/.bun/bin/" && rm -rf bun.zip bun-linux-x64
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: go version && bun --version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Release gate: the SPEC fixture suite (tests/ = loader-js's stamped set) and the API
      # surface snapshot. Tags before the fixtures were tracked have no tests/; only a manual
      # backfill of such a tag may skip, and it says so. A tag push always tests.
      - name: Test
        run: |
          if [ ! -f tests/fixtures.json ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::warning::$TAG predates the tracked fixtures (tests/); test suite skipped for this backfill."
            exit 0
          fi
          go test -count=1 ./...

      # The compatibility gate (workspace layout-and-packaging.md Rules 2, 3, 6): the step from
      # the previous tag must meet the API-surface / SPEC floor, and the previous tag's tests
      # must pass for a compatible step. Tags before the gate existed have no scripts/compat.ts;
      # only a manual backfill of such a tag may skip, and it says so.
      - name: Compatibility gate
        run: |
          if [ ! -f scripts/compat.ts ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::warning::$TAG predates the compatibility gate (scripts/compat.ts); gate skipped for this backfill."
            exit 0
          fi
          bun scripts/compat.ts --release "$TAG"

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # only for `gh release create` / `edit`
    steps:
      - name: Clone the tag (no token) and confirm it is the commit `checks` passed
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TAG" "https://github.com/${{ github.repository }}" .
          test "$(git rev-parse HEAD)" = "${{ needs.checks.outputs.commit }}" \
            || { echo "::error::tag $TAG moved after the checks ran"; exit 1; }

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          # The tag may predate CHANGELOG.md (e.g. a backfilled v0.1.0). In that
          # case pull the canonical CHANGELOG from the default branch.
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md not present at $TAG; fetching from default branch."
            git fetch --depth=1 origin "${{ github.event.repository.default_branch }}"
            git show FETCH_HEAD:CHANGELOG.md > CHANGELOG.md
          fi
          # The heading is matched LITERALLY (index), not as a dynamic regex: gawk reads
          # "\\[" in a dynamic regex as a bracket expression, mawk does not.
          awk -v ver="$TAG" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && /^## \[/ { exit }
            flag && /^\[[^]]+\]: / { next }
            flag { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section for $TAG; using a default note."
            echo "Release $TAG." > RELEASE_NOTES.md
          fi
          echo "----- notes for $TAG -----"
          cat RELEASE_NOTES.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag
          fi
