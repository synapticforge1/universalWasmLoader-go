name: release

# Every push of `main` runs `checks`. When that commit is a release — CHANGELOG.md's top
# `## [vX.Y.Z]` heading (stamped by `scripts/bump.ts`) has no tag on GitHub yet — the SAME run then
# goes on, in the owner's order (2026-11-10, workspace letter H33, release-process.md § 5):
#
#   checks (U5)  → tag (U6)       → release (U7)          → publish (U8)
#   the gate       CI's annotated   the GitHub Release      a Go module's publish is the proxy:
#                  tag vX.Y.Z on    page FROM the tag       read .info (Origin.Hash = this
#                  this commit      (H32's order)           commit), .mod and sum.golang.org
#
# A tag made with the job's GITHUB_TOKEN starts no new run, so all four are `needs:` of one run.
# Nobody pushes a tag by hand any more: `scripts/release.ts` pushes `main` only. A failed job is
# fixed by "Re-run failed jobs" (U12): `state` reads "rerun" when the tag already peels to this
# commit, and each job skips what is done — never a new or moved tag.
#
# Permissions: none at the top; each job holds only its own. `checks` runs EVERYTHING that executes
# third-party code (`go test` runs wazero and golang.org/x/sys; Bun runs the scripts) with a
# read-only token and a tokenless clone. `tag` and `release` check out NOTHING: pinned Bun and
# `scripts/ci-release.ts` fetched alone at github.sha (C30). `publish` holds no write permission.
#
# No `uses:` steps at all: Go and Bun come from their official downloads, pinned by version AND
# sha256 (U9), so no third-party action code runs and the Actions policy cannot block a step. To
# move a pin, change the version and its sha256 together (Go: https://go.dev/dl/?mode=json&include=all;
# Bun: the release's SHASUMS256.txt). Every request in ci-release.ts has a 30 s limit (7.21).

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.26.4
  GO_SHA256: 1153d3d50e0ac764b447adfe05c2bcf08e889d42a02e0fe0259bd47f6733ad7f
  BUN_VERSION: 1.4.4
  BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.state.outputs.release }}
      tag: ${{ steps.state.outputs.tag }}
    steps:
      - name: Clone the pushed commit (full history for the gate; no token)
        run: |
          set -euo pipefail
          git clone "https://github.com/${{ github.repository }}" .
          git checkout --quiet --detach "${{ github.sha }}"
          [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ] || { echo "::error::HEAD is not ${{ github.sha }}"; exit 1; }

      - name: Install Go (pinned by sha256)
        run: |
          set -euo pipefail
          mod="$(sed -n 's/^go \([0-9.]*\)$/\1/p' go.mod)"
          [ "$mod" = "$GO_VERSION" ] || { echo "::error::go.mod says go $mod; the workflow pins $GO_VERSION — move GO_VERSION and GO_SHA256 together"; exit 1; }
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/go.tgz" "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  $RUNNER_TEMP/go.tgz" | sha256sum -c -
          sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf "$RUNNER_TEMP/go.tgz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Install Bun (pinned by sha256)
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/bun.zip" && mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: go version && bun --version

      # U5: is this commit a release? new = the top CHANGELOG version is untagged; rerun = it is
      # tagged on THIS commit; none = an ordinary push.
      - name: Is this a release?
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }} # read-only here; avoids the unauthenticated rate limit
          RELEASE_SHA: ${{ github.sha }}
        run: bun scripts/ci-release.ts state

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The SPEC fixture suite (tests/ = loader-js's stamped set) and the API surface snapshot.
      - name: Test
        run: go test -count=1 ./...

      # The CI release script's own tests (a mock GitHub API, Go proxy and sumdb).
      - name: Test the CI release script
        run: bun test scripts/

      # A release: the floor and the previous tag's tests on this untagged candidate. Any other
      # push: the snapshot and the floor only (the previous tag's tests may be red by design
      # between an intended break and its bump).
      - name: Compatibility gate
        env:
          RELEASE: ${{ steps.state.outputs.release }}
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          if [ "$RELEASE" = "none" ]; then bun scripts/compat.ts --no-tests; else bun scripts/compat.ts --release "$TAG"; fi

  tag:
    needs: checks
    if: needs.checks.outputs.release != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only for the tag in scripts/ci-release.ts
    steps:
      - name: Install Bun (pinned by sha256)
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/bun.zip" && mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Fetch the CI release script at the commit (no checkout)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 -o "$RUNNER_TEMP/ci-release.ts" \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci-release.ts"

      - name: Create the tag (REST API)
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checks.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: bun ci-release.ts tag

  release:
    needs: [checks, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write # only for the POST of the page in scripts/ci-release.ts
    steps:
      - name: Install Bun (pinned by sha256)
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/bun.zip" && mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Fetch the CI release script at the commit (no checkout)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 -o "$RUNNER_TEMP/ci-release.ts" \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci-release.ts"

      - name: Create the GitHub Release page from the tag (REST API)
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.checks.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: bun ci-release.ts page

  publish:
    needs: [checks, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install Bun (pinned by sha256)
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/bun.zip" "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q -d "$RUNNER_TEMP" "$RUNNER_TEMP/bun.zip" && mkdir -p "$HOME/.bun/bin" && mv "$RUNNER_TEMP/bun-linux-x64/bun" "$HOME/.bun/bin/"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Fetch the CI release script at the commit (no checkout)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --max-time 60 -o "$RUNNER_TEMP/ci-release.ts" \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/ci-release.ts"

      # U8: the proxy fetches the new tag on this first request (the "publish"); then FATAL unless
      # .info's Origin.Hash is this commit, .mod is served and sum.golang.org has the h1: line.
      - name: Publish through the Go proxy and read it back (FATAL)
        working-directory: ${{ runner.temp }}
        env:
          RELEASE_TAG: ${{ needs.checks.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: bun ci-release.ts proxy

      - name: Install Go (pinned by sha256)
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/go.tgz" "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  $RUNNER_TEMP/go.tgz" | sha256sum -c -
          sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf "$RUNNER_TEMP/go.tgz"
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      # U10 in CI: what a user's `go get` does — download through the proxy, verified against
      # sum.golang.org. Nothing of the module is built or run.
      - name: Download as a user, checksum-verified
        working-directory: ${{ runner.temp }}
        env:
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOFLAGS: -mod=mod
        run: go mod download -json "github.com/synapticforge1/universalWasmLoader-go@${{ needs.checks.outputs.tag }}"
